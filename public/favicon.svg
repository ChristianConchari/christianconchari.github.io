<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <text x="128" y="128" text-anchor="middle" dominant-baseline="central" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="105">
        <tspan class="cc-bracket">⟨</tspan><tspan class="cc-letters" font-weight="600">CC</tspan><tspan class="cc-bracket">⟩</tspan>
    </text>
    <style>
        .cc-bracket { fill: #6f97c9; }
        .cc-letters { fill: #1f2129; }
        @media (prefers-color-scheme: dark) {
            .cc-letters { fill: #F2EFE8; }
        }
    </style>
</svg>
